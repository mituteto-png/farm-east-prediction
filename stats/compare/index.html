uggestions"></div><p class="tiny">同じカテゴリーで2〜4選手を選択してください。比較URLはそのまま共有できます。</p></div><div id="compareMessage" role="status"></div><div id="comparePlayers" class="comparePlayers"></div><div class="compareControls"><label>表示項目<select id="compareMetricSet"><option value="basic">基本指標</option><option value="detail">詳細指標</option><option value="custom">選択する</option></select></label><button id="clearCompare" class="filterBtn" type="button">すべてクリア</button><div id="compareMetricChoices" class="metricChoices" hidden></div></div><div id="compareVisuals" class="compareVisuals"></div><div id="compareTable" class="compareTable"></div></section></main><footer>個人成績はNPB公式ファーム成績を参照。比較結果は選手評価の断定ではなく、数値確認のための表示です。</footer></div><script src="auto-data.js"></script><script src="farmchamp-data.js"></script><script type="module" src="site.js?v=9"></script><script type="module" src="stats-app.js?v=10"></script></body></html>
