name: Update official farm results

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC: 23:00 (previous day) and 08:00 = 08:00 and 17:00 Japan time.
    # 08:00 / 17:00 JST。ファーム公式戦がある8〜10月に確認する。
    - cron: "0 23,8 * 8-10 *"

permissions:
  contents: write

concurrency:
  group: update-official-farm-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch NPB official results
        run: node scripts/update-results.mjs

      - name: Fetch farm championship eligibility data
        run: node scripts/update-farmchamp-data.mjs

      - name: Test farm championship eligibility logic
        run: node --test tests/farmchamp.test.mjs

      - name: Commit changes when official results changed
        shell: bash
        run: |
          if git diff --quiet -- auto-data.js farmchamp-data.js; then
            echo "No new official results."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto-data.js farmchamp-data.js
          git commit -m "Update official farm and championship data"
          git push
